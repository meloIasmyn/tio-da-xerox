<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tio da Xerox</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <div class="marca">🖨️ <b>Tio da Xerox</b></div>
  <div class="sub">Cota da turma · Sistemas Distribuídos</div>
</header>

<main>
  <!-- Identificação -->
  <section id="tela-nome" class="card">
    <h2>Quem é você?</h2>
    <input id="nome" maxlength="20" placeholder="Seu nome" autocomplete="off">
    <button class="btn primario" id="entrar">Entrar</button>
  </section>

  <div id="app" hidden>
    <!-- Saldo -->
    <section class="card saldo">
      <div class="rotulo">Saldo da turma</div>
      <div class="numero"><span id="saldo">–</span><small> / <span id="cota">200</span> pág</small></div>
      <div class="barra"><div id="barra"></div></div>
      <div id="alerta" class="alerta" hidden></div>
    </section>

    <!-- Pedido -->
    <section class="card" id="card-pedido">
      <div class="rotulo">Quantas páginas você vai imprimir?</div>
      <div class="stepper">
        <button class="btn" data-d="-5">−5</button>
        <button class="btn" data-d="-1">−1</button>
        <input id="paginas" type="number" min="1" max="50" value="10" inputmode="numeric">
        <button class="btn" data-d="1">+1</button>
        <button class="btn" data-d="5">+5</button>
      </div>
      <button class="btn primario grande" id="reservar">Reservar páginas</button>
      <div id="msg" class="msg"></div>
    </section>

    <!-- Minha reserva -->
    <section class="card destaque" id="card-reserva" hidden>
      <div class="rotulo">Sua reserva está segura por</div>
      <div class="contador"><span id="seg">30</span>s</div>
      <div class="barra fina"><div id="barra-tempo"></div></div>
      <p><b id="r-pag"></b> páginas · carimbo de Lamport <b id="r-L"></b></p>
      <div class="linha">
        <button class="btn" id="cancelar">Cancelar</button>
        <button class="btn verde" id="confirmar">Confirmar impressão</button>
      </div>
    </section>

    <!-- Fila -->
    <section class="card">
      <div class="rotulo">Fila da copiadora <small>(ordem por relógio de Lamport)</small></div>
      <ol id="fila" class="lista"></ol>
    </section>

    <section class="card">
      <div class="rotulo">Acontecendo agora</div>
      <ul id="log" class="log"></ul>
    </section>
  </div>
</main>

<footer id="rodape">conectando…</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const socket = io();
let nome = '';
let L = 0;              // relógio lógico (Lamport) deste celular
let versao = 0;         // última versão de estado aplicada
let minha = null;       // reserva ativa
let estadoAtual = null;

try { nome = localStorage.getItem('tx-nome') || ''; } catch (e) {}
if (nome) entrar(); else $('nome').focus();

$('entrar').onclick = () => { nome = $('nome').value.trim(); if (nome) { try { localStorage.setItem('tx-nome', nome); } catch (e) {} entrar(); } };
$('nome').onkeydown = e => e.key === 'Enter' && $('entrar').click();
function entrar() { $('tela-nome').hidden = true; $('app').hidden = false; }

// Lamport: incrementa antes de enviar, ajusta ao receber
const enviarL = () => ++L;
const receberL = Lr => { L = Math.max(L, Lr || 0) + 1; };

document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
  const v = Math.min(50, Math.max(1, (+$('paginas').value || 0) + +b.dataset.d));
  $('paginas').value = v;
});

$('reservar').onclick = () => {
  const paginas = +$('paginas').value;
  $('reservar').disabled = true;
  $('msg').textContent = 'Pedindo ao servidor…';
  $('msg').className = 'msg';
  socket.emit('reservar', { nome, paginas, L: enviarL() }, res => {
    receberL(res.L);
    $('reservar').disabled = false;
    if (res.ok) { minha = res.reserva; $('msg').textContent = ''; mostrarReserva(); }
    else { $('msg').textContent = '❌ ' + res.msg; $('msg').className = 'msg erro'; }
  });
};
$('confirmar').onclick = () => socket.emit('confirmar', { id: minha.id, L: enviarL() }, res => {
  $('msg').textContent = res.ok ? '✅ Confirmado! Você entrou na fila da copiadora.' : '❌ ' + res.msg;
  $('msg').className = 'msg ' + (res.ok ? 'ok' : 'erro');
  minha = null; mostrarReserva();
});
$('cancelar').onclick = () => socket.emit('cancelar', { id: minha.id }, () => { minha = null; mostrarReserva(); });

function mostrarReserva() {
  $('card-reserva').hidden = !minha;
  $('card-pedido').hidden = !!minha;
  if (minha) { $('r-pag').textContent = minha.paginas; $('r-L').textContent = minha.L; }
}

// Contagem regressiva da reserva
setInterval(() => {
  if (!minha || !estadoAtual) return;
  const rest = Math.max(0, minha.expira - Date.now());
  $('seg').textContent = Math.ceil(rest / 1000);
  $('barra-tempo').style.width = (rest / estadoAtual.reservaMs * 100) + '%';
}, 200);

// Recebe o estado replicado do servidor
socket.on('estado', s => {
  if (s.versao <= versao) return;      // descarta mensagem atrasada/fora de ordem
  versao = s.versao; receberL(s.lamport); estadoAtual = s;

  $('saldo').textContent = s.saldo;
  $('cota').textContent = s.cota;
  const pct = Math.max(0, Math.min(100, s.saldo / s.cota * 100));
  $('barra').style.width = pct + '%';
  $('barra').style.background = pct < 15 ? 'var(--erro)' : pct < 40 ? 'var(--aviso)' : 'var(--verde)';

  const alerta = $('alerta');
  if (!s.integridade) { alerta.hidden = false; alerta.textContent = `⚠️ INCONSISTÊNCIA: ${s.excesso} páginas distribuídas além da cota!`; }
  else alerta.hidden = true;

  // minha reserva sumiu do servidor? (expirou)
  if (minha && !s.reservas.some(r => r.id === minha.id)) {
    minha = null; mostrarReserva();
    if (!$('msg').textContent) { $('msg').textContent = '⏱️ Sua reserva expirou e as páginas voltaram para a turma.'; $('msg').className = 'msg aviso'; }
  }

  $('fila').innerHTML = s.fila.length
    ? s.fila.map(f => `<li class="${f.nome === nome ? 'eu' : ''}"><span>${esc(f.nome)}</span><span>${f.paginas} pág · L${f.L}</span></li>`).join('')
    : '<li class="vazio">Fila vazia</li>';
  $('log').innerHTML = s.log.slice(0, 8).map(e => `<li class="${e.tipo}"><small>L${e.L}</small> ${esc(e.texto)}</li>`).join('');
  $('rodape').innerHTML = `🟢 ${s.online} online · versão ${s.versao} · meu relógio L=${L} · ${s.usarLock ? '🔒 lock ON' : '🔓 lock OFF'}`;
});
socket.on('disconnect', () => $('rodape').textContent = '🔴 desconectado — tentando reconectar…');
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
</script>
</body>
</html>
